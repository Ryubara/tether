# The weekly sweep: reports stale or malformed issues and pull requests as one comment on the "Repo hygiene" issue
# (created when missing), and checks that the generated files still match the conventions. It only comments; it never
# edits an issue's title, body, labels or state. It is not a required check, so a failure here never blocks a merge.
# It checks out the default branch only (never a pull request's code). The schedule must equal hygiene.sweep in
# .github/conventions.yml.
name: hygiene

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run --with pyyaml python .github/scripts/groundwork.py hygiene --apply
      - name: Files follow the conventions
        run: uv run --with pyyaml python .github/scripts/groundwork.py render --check
